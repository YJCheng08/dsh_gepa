[workspace]
resolver = "3"
members = ["gepa-core", "gepa-reflect", "gepa-eval", "gepa-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gepa-core = { path = "gepa-core" }
gepa-reflect = { path = "gepa-reflect" }
gepa-eval = { path = "gepa-eval" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
clap = { version = "4", features = ["derive"] }
