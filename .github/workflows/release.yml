name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows-x86_64
            ext: .exe
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux-x86_64
            ext: ""
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: macos-aarch64
            ext: ""
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p gepa-cli --target ${{ matrix.target }}

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like "v*") { $env:GITHUB_REF_NAME } else { "dev" }
          $stage = "dist/gepa"
          New-Item -ItemType Directory -Force -Path "$stage/bin", "$stage/.claude-plugin", "$stage/skills/gepa" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/gepa.exe" "$stage/bin/"
          Copy-Item "plugin.json", "Agent.md", "README.md" "$stage/"
          Copy-Item ".claude-plugin/plugin.json" "$stage/.claude-plugin/"
          Copy-Item "skills/gepa/SKILL.md" "$stage/skills/gepa/"
          Compress-Archive -Path "$stage" -DestinationPath "dist/gepa-$tag-${{ matrix.asset_os }}.zip" -Force

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="dev"; fi
          STAGE="dist/gepa"
          mkdir -p "$STAGE/bin" "$STAGE/.claude-plugin" "$STAGE/skills/gepa"
          cp "target/${{ matrix.target }}/release/gepa" "$STAGE/bin/"
          chmod +x "$STAGE/bin/gepa"
          cp plugin.json Agent.md README.md "$STAGE/"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp skills/gepa/SKILL.md "$STAGE/skills/gepa/"
          tar -czf "dist/gepa-${TAG}-${{ matrix.asset_os }}.tar.gz" -C dist gepa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gepa-${{ matrix.asset_os }}
          path: dist/gepa-*.${{ matrix.archive_ext }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/gepa-*
          generate_release_notes: true
